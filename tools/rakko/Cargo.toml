[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
publish = false

# The binary is named `rakko`, so that it reads well on the command line.
[[bin]]
name = "rakko"
path = "src/main.rs"

[dependencies]
# Rakko's crates carry no version, so that Renovate follows its default branch
# and updates `Cargo.lock` with the new rev.
rakko = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-baseline = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-cli = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-format-json = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-format-markdown = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-format-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-format-toml = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-format-yaml = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-lint-github-actions = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-lint-markdown = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-lint-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-lint-toml = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-lint-yaml = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-pre-commit = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-rust-binary = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }
rakko-test-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "1875679016d8b30862b8522e4516ef5a4bf64e99" }

[lints]
workspace = true
