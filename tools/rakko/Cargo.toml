[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
publish = false

# The binary is named `rakko`, so that it reads well on the command line.
[[bin]]
name = "rakko"
path = "src/main.rs"

[dependencies]
# Rakko's crates carry no version, so that Renovate follows its default branch
# and updates `Cargo.lock` with the new rev.
rakko = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-baseline = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-cli = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-format-json = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-format-markdown = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-format-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-format-toml = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-format-yaml = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-lint-github-actions = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-lint-markdown = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-lint-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-lint-toml = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-lint-yaml = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-pre-commit = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-rust-binary = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }
rakko-test-rust = { git = "https://github.com/aonyx-ai/rakko", rev = "527d36ef3c0fd453ca8d835f97b64e48ffe242ca" }

[lints]
workspace = true
