[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
publish = false

# The binary is named `rakko`, so that it reads well on the command line.
[[bin]]
name = "rakko"
path = "src/main.rs"

[dependencies]
aonyx-rakko-baseline = "0.1"
aonyx-rakko-format-json = "0.1"
aonyx-rakko-format-markdown = "0.1"
aonyx-rakko-format-rust = "0.1"
aonyx-rakko-format-toml = "0.1"
aonyx-rakko-format-yaml = "0.1"
aonyx-rakko-lint-github-actions = "0.1"
aonyx-rakko-lint-markdown = "0.1"
aonyx-rakko-lint-rust = "0.1"
aonyx-rakko-lint-toml = "0.1"
aonyx-rakko-lint-yaml = "0.1"
aonyx-rakko-pre-commit = "0.1"
aonyx-rakko-rust-binary = "0.1"
aonyx-rakko-test-rust = "0.1"
rakko = "0.1"
rakko-cli = "0.1"

[lints]
workspace = true
